<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachr Command Center</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');:root{--bg:#080a0e;--surface:#11151c;--line:#272d37;--text:#f3f5f8;--muted:#929ba8;--green:#81f1b2;--blue:#8eb7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 400px at 80% -10%,#13253b 0%,transparent 65%),var(--bg);color:var(--text);font-family:Manrope,sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:50px 24px}.eyebrow,.label,.footer{font:500 11px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}.eyebrow{color:var(--green)}header{border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:28px}h1{font-size:36px;letter-spacing:-1.6px;margin:8px 0}.sub,.footer{color:var(--muted)}.cards{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:16px}.card,.days{background:linear-gradient(135deg,#151b24,#0f1218);border:1px solid var(--line);border-radius:18px;padding:24px}.primary{border-color:#356650;background:linear-gradient(135deg,#143026,#101916)}.label{color:var(--muted)}.count{font-size:78px;line-height:1;font-weight:800;letter-spacing:-5px;margin:15px 0 7px;color:var(--green)}.metric{font-size:34px;font-weight:800;margin-top:16px}.caption{font-size:14px;color:#bbc3cc}.days{margin-top:24px}.days h2{font-size:16px;margin:0 0 18px}.day{display:grid;grid-template-columns:94px 1fr 36px;gap:12px;align-items:center;margin:10px 0;font:12px 'DM Mono',monospace}.date{color:var(--muted)}.track{height:8px;border-radius:20px;background:#202630;overflow:hidden}.bar{height:100%;min-width:0;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--green))}.dayCount{text-align:right;font-weight:500}.footer{margin-top:24px}@media(max-width:650px){main{padding:30px 16px}.cards{grid-template-columns:1fr}.count{font-size:68px}}</style></head><body><main><header><div class="eyebrow">Messenger outreach</div><h1>Reachr Command Center</h1><div class="sub" id="status">Loading verified delivery data…</div></header><section class="cards"><article class="card primary"><div class="label">Sent today</div><div class="count" id="sent">—</div><div class="caption">Platform-confirmed Messenger sends</div></article><article class="card"><div class="label">All confirmed</div><div class="metric" id="total">—</div></article><article class="card"><div class="label">Needs review</div><div class="metric" id="review">—</div></article></section><section class="days"><h2>Daily confirmed sends</h2><div id="days">Loading daily breakdown…</div></section><div class="footer" id="updated"></div></main><script>const byId=id=>document.getElementById(id);fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{byId('sent').textContent=d.sentToday;byId('total').textContent=d.totalConfirmed;byId('review').textContent=d.needsReview;byId('status').textContent='Edmonton local day · '+d.localDate;byId('updated').textContent='Updated '+new Date(d.updatedAt).toLocaleString()+' · Confirmed-delivery ledger only.';const days=d.dailyBreakdown||[];const max=Math.max(1,...days.map(x=>x.sent));byId('days').innerHTML=days.map(x=>`<div class="day"><span class="date">${x.date}</span><div class="track"><div class="bar" style="width:${x.sent/max*100}%"></div></div><span class="dayCount">${x.sent}</span></div>`).join('')}).catch(()=>byId('status').textContent='Dashboard data is temporarily unavailable.')</script></body></html>
