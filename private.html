<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachr — Private Inbox</title><style>
:root{color-scheme:dark;--bg:#090c11;--panel:#121820;--line:#2a3441;--ink:#edf4f7;--muted:#9aa7b5;--brand:#6ef0b0;--blue:#83b6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px 20px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.tag{color:var(--brand);font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{margin:5px 0 0;font-size:28px}.muted{color:var(--muted)}button,input,textarea{font:inherit}button{background:var(--brand);border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#202a36;color:var(--ink)}.shell{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:20px}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.list{max-height:68vh;overflow:auto}.item{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#18222e}.item b{display:block}.thread{height:52vh;overflow:auto;padding:18px}.bubble{max-width:78%;padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}.inbound{background:#25313e}.outbound{background:#143d2e;margin-left:auto}.meta{font-size:11px;color:var(--muted);margin-top:7px}.composer{border-top:1px solid var(--line);padding:14px}.composer textarea{width:100%;min-height:86px;background:#0a1017;border:1px solid var(--line);border-radius:8px;color:var(--ink;padding:10px;color:var(--ink)}.actions{display:flex;gap:8px;margin-top:9px}.hidden{display:none}.notice{padding:16px;border:1px solid #815f22;background:#2a2112;border-radius:10px;margin:18px 0}.empty{padding:28px;color:var(--muted)}@media(max-width:720px){.shell{grid-template-columns:1fr}.thread{height:46vh}}
</style></head><body><main>
<div class="bar"><div><div class="tag">Reachr private operations</div><h1>Message inbox</h1></div><button id="signOut" class="secondary hidden">Sign out</button></div>
<section id="auth" class="notice"><b>Private access required.</b><p class="muted">Send a sign-in link to your operator email. Conversations are never included in the public reporting dashboard.</p><div class="actions"><input id="email" aria-label="Email" value="wildejack1010@gmail.com"><button id="signIn">Send sign-in link</button></div><p id="authStatus" class="muted"></p></section>
<section id="app" class="hidden"><div class="shell"><aside class="panel"><div class="item"><b>Conversations</b><span class="muted">Marketplace excluded</span></div><div id="conversations" class="list"></div></aside><section class="panel"><div id="thread" class="thread"><div class="empty">Select a conversation.</div></div><div class="composer"><label for="draft" class="tag">Exact reply draft</label><textarea id="draft" placeholder="Write the exact response. Nothing sends automatically."></textarea><div class="actions"><button id="saveDraft" class="secondary" disabled title="Queue database is not initialized">Save draft</button><button id="approve" disabled title="Verified queue worker is not connected">Approve & queue (not active)</button></div><p id="jobStatus" class="meta"></p></div></section></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-config.js"></script><script>
const cfg=window.REACHR_SUPABASE, sb=window.supabase.createClient(cfg.url,cfg.publishableKey);let selected=null;
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function session(){const{data:{session}}=await sb.auth.getSession();$('auth').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('signOut').classList.toggle('hidden',!session);if(session) await load();}
async function load(){const{data,error}=await sb.from('reachr_conversations').select('id,business_name,updated_at').eq('marketplace_excluded',false).order('updated_at',{ascending:false});if(error){$('conversations').innerHTML='<div class="empty">Inbox is not initialized yet.</div>';return;}$('conversations').innerHTML=(data||[]).map(c=>`<div class="item ${selected?.id===c.id?'active':''}" data-id="${c.id}"><b>${esc(c.business_name)}</b><span class="meta">${new Date(c.updated_at).toLocaleString()}</span></div>`).join('')||'<div class="empty">No conversations synced yet.</div>';document.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>select(data.find(c=>c.id===n.dataset.id)));}
async function select(c){selected=c;await load();const{data,error}=await sb.from('reachr_messages').select('direction,body,observed_at,provenance').eq('conversation_id',c.id).order('observed_at');$('thread').innerHTML=error?'<div class="empty">Unable to load thread.</div>':(data||[]).map(m=>`<div class="bubble ${m.direction}"><b>${m.direction==='inbound'?'Inbound':'Outbound'}</b><br>${esc(m.body)}<div class="meta">${esc(m.provenance)} · ${m.observed_at?new Date(m.observed_at).toLocaleString():'time unavailable'}</div></div>`).join('')||'<div class="empty">No retained messages.</div>';}
async function createJob(status){if(!selected)return $('jobStatus').textContent='Select a conversation first.';const body=$('draft').value.trim();if(!body)return $('jobStatus').textContent='Write the exact reply first.';const{data:{user}}=await sb.auth.getUser();const row={conversation_id:selected.id,body,status,created_by:user.id};if(status==='approved')row.approved_at=new Date().toISOString();const{error}=await sb.from('reachr_reply_jobs').insert(row);$('jobStatus').textContent=error?`Not queued: ${error.message}`:status==='approved'?'Approved and queued. It is not sent until the verified local worker records delivery evidence.':'Draft saved.';if(!error)$('draft').value='';}
$('signIn').onclick=async()=>{const email=$('email').value.trim();const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('authStatus').textContent=error?error.message:'Sign-in link sent. Open it on this device.'};$('signOut').onclick=async()=>{await sb.auth.signOut();session()};$('saveDraft').onclick=()=>createJob('draft');$('approve').onclick=()=>createJob('approved');session();
</script></body></html>
