<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachr — Private Inbox</title><style>
:root{color-scheme:dark;--bg:#090c11;--panel:#121820;--line:#2a3441;--ink:#edf4f7;--muted:#9aa7b5;--brand:#6ef0b0;--blue:#83b6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:30px 20px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.tag{color:var(--brand);font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{margin:5px 0 0;font-size:28px}.muted{color:var(--muted)}button,input,textarea{font:inherit}button{background:var(--brand);border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#202a36;color:var(--ink)}.shell{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:20px}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.list{max-height:68vh;overflow:auto}.item{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#18222e}.item b{display:block}.thread{height:52vh;overflow:auto;padding:18px}.bubble{max-width:78%;padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}.inbound{background:#25313e}.outbound{background:#143d2e;margin-left:auto}.meta{font-size:11px;color:var(--muted);margin-top:7px}.composer{border-top:1px solid var(--line);padding:14px}.composer textarea{width:100%;min-height:86px;background:#0a1017;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink)}.actions{display:flex;gap:8px;margin-top:9px}.hidden{display:none}.notice{padding:16px;border:1px solid #815f22;background:#2a2112;border-radius:10px;margin:18px 0}.empty{padding:28px;color:var(--muted)}@media(max-width:720px){.shell{grid-template-columns:1fr}.thread{height:46vh}}
</style></head><body><main>
<div class="bar"><div><div class="tag">Reachr private operations</div><h1>Message inbox</h1></div><button id="signOut" class="secondary hidden">Sign out</button></div>
<section id="auth" class="notice"><b>Private access required.</b><p class="muted">Send a sign-in link to your operator email. Conversations are never included in the public reporting dashboard.</p><div class="actions"><input id="email" aria-label="Email" value="wildejack1010@gmail.com"><button id="signIn">Send sign-in link</button></div><p id="authStatus" class="muted"></p></section>
<section id="app" class="hidden"><div class="shell"><aside class="panel"><div class="item"><b>Conversations</b><span class="muted">Marketplace excluded</span></div><div id="conversations" class="list"></div></aside><section class="panel"><div id="thread" class="thread"><div class="empty">Select a conversation.</div></div><div class="composer"><label for="draft" class="tag">Exact reply draft</label><textarea id="draft" placeholder="Write the exact response. Nothing sends automatically."></textarea><div class="actions"><button id="saveDraft" class="secondary" disabled title="Queue database is not initialized">Save draft</button><button id="approve" disabled title="Verified queue worker is not connected">Approve & queue (not active)</button></div><p id="jobStatus" class="meta"></p></div></section></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="private-config.js"></script><script>
const cfg=window.REACHR_SUPABASE, sb=window.supabase.createClient(cfg.url,cfg.publishableKey),API='https://n8n.wildeautomations.com/reachr-inbox';let selected=null,job=null;
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function call(route,method='GET',body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in required');const r=await fetch(API+route,{method,headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:body&&JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||`API ${r.status}`);return data}
async function session(){const{data:{session}}=await sb.auth.getSession();$('auth').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);$('signOut').classList.toggle('hidden',!session);window.parent.postMessage({type:'reachr-inbox-size',authenticated:!!session},location.origin);if(session)await load();}
async function load(){let data;try{data=await call('/conversations')}catch(e){$('saveDraft').disabled=true;$('approve').disabled=true;$('conversations').textContent=`Inbox unavailable: ${e.message}`;return;}$('saveDraft').disabled=!selected;$('conversations').innerHTML=(data||[]).map(c=>`<div class="item ${selected?.id===c.id?'active':''}" data-id="${esc(c.id)}"><b>${esc(c.business_name)}</b><span class="meta">${esc(c.recipient_name||'Recipient unavailable')} · ${c.updated_at?new Date(c.updated_at).toLocaleString():'time unavailable'}</span></div>`).join('')||'<div class="empty">No independently verified conversations available. Inbox previews are not treated as confirmed threads.</div>';document.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>select(data.find(c=>c.id===n.dataset.id)));}
async function select(c){selected=c;job=null;$('draft').value='';$('approve').disabled=true;await load();try{const data=await call('/messages?conversation_id='+encodeURIComponent(c.id));$('thread').innerHTML=data.map(m=>`<div class="bubble ${m.direction}"><b>${m.direction==='inbound'?'Inbound':'Outbound'}</b><br>${esc(m.body)}<div class="meta">${esc(m.provenance)} · ${m.observed_at?new Date(m.observed_at).toLocaleString():'time unavailable'}</div></div>`).join('')||'<div class="empty">No retained messages.</div>'}catch(e){$('thread').textContent=`Unable to load thread: ${e.message}`}}
async function createDraft(){if(!selected)return;$('jobStatus').textContent='';const body=$('draft').value;if(!body.trim())return $('jobStatus').textContent='Write the exact reply first.';try{job=await call('/drafts','POST',{conversation_id:selected.id,body});$('approve').disabled=!selected.sender_verified;$('approve').textContent=selected.sender_verified?'Review & approve':'Sender identity unverified';$('jobStatus').textContent=selected.sender_verified?`Draft saved for ${job.recipient_name}. Review the exact text before approval; nothing has been sent.`:'Draft saved. Approval blocked: sender identity is unverified.'}catch(e){$('jobStatus').textContent=`Draft not saved: ${e.message}`}}
async function approve(){if(!job)return;const typed=window.prompt(`Approve reply to ${job.recipient_name}? Retype the exact message to confirm:`, '');if(typed===null)return;if(typed!==job.body){$('jobStatus').textContent='Exact-text confirmation did not match. Not approved.';return}if(!window.confirm(`Queue exact reply to ${job.recipient_name}? This will NOT mark it sent.`))return;try{await call('/jobs/'+job.id+'/approve','POST',{explicit_approval:true,exact_body:typed,recipient_name:job.recipient_name});$('jobStatus').textContent='Approved and queued; not sent. Waiting for verified Mac worker.';$('approve').disabled=true}catch(e){$('jobStatus').textContent=`Not approved: ${e.message}`}}
$('signIn').onclick=async()=>{const email=$('email').value.trim();const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('authStatus').textContent=error?error.message:'Sign-in link sent. Open it on this device.'};$('signOut').onclick=async()=>{await sb.auth.signOut();session()};$('saveDraft').onclick=createDraft;$('approve').onclick=approve;sb.auth.onAuthStateChange(()=>setTimeout(session,0));session();
</script></body></html>
